<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <form id="adminLogin" class="card">
      <h2>Admin Login</h2>
      <input type="text" id="adminUser" placeholder="Username" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit" class="btn btn-secondary">Login</button>
      <a href="login-cashier.html">Cashier Site</a>
    </form>
  </div>
  <footer><p>&copy; 2025 H&H Snacks and More</p></footer>
  <script>
    const adminCred = { user: 'Admin2025', pass: 'Habeeb@1' };
    document.getElementById('adminLogin').onsubmit = e => {
      e.preventDefault();
      if (adminUser.value === adminCred.user && adminPass.value === adminCred.pass) {
        sessionStorage.setItem('role', 'admin');
        window.location.href = 'admin.html';
      } else alert('Invalid credentials');
    };
  </script>
</body>
</html>
