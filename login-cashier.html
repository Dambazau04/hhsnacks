<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashier Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <form id="cashierLogin" class="card">
      <h2>Cashier Login</h2>
      <input type="text" id="cashierUser" placeholder="Username" required>
      <input type="password" id="cashierPass" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Login</button>
      <a href="admin.html">Admin Site</a>
    </form>
  </div>
  <footer><p>&copy; 2025 H&H Snacks and More</p></footer>
  <script>
    const cashierCred = { user: 'H&H2025', pass: 'h&h@12345', name: 'Aliyu Bashir Lawan' };
    document.getElementById('cashierLogin').onsubmit = e => {
      e.preventDefault();
      if (cashierUser.value === cashierCred.user && cashierPass.value === cashierCred.pass) {
        sessionStorage.setItem('role', 'cashier');
        sessionStorage.setItem('username', cashierCred.name);
        window.location.href = 'welcome.html';
      } else alert('Invalid credentials');
    };
  </script>
</body>
</html>
